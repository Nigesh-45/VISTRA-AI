services:
  - type: web
    name: vistra-ai
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: bash scripts/start_render.sh
    plan: starter
    region: singapore
    envVars:
      - key: PORT
        value: 10000
      - key: CONFIG_PATH
        value: config.json
      - key: PYTHONUNBUFFERED
        value: "1"
